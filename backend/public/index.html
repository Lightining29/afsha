  <iframe src="about:blank" allow="autoplay" style="display:none;position:absolute;width:0;height:0;border:0;" id="autoplay-frame"></iframe>

  <script>
    (function () {
      // Direct automated entrance audio controller (Runs before React loads)
      try {
        var audio = new Audio('/entrance.mp3');
        audio.id = 'afsha-entrance-audio';
        audio.preload = 'auto';
        audio.volume = 1.0;
        audio.setAttribute('playsinline', 'true');
        audio.setAttribute('webkit-playsinline', 'true');
        window.__afshaEntranceAudio = audio;

        var audioPlayed = false;

        function attemptAutoPlay() {
          if (audioPlayed) return;
          var p = audio.play();
          if (p !== undefined) {
            p.then(function () {
              audioPlayed = true;
              window.__afshaAudioPlayed = true;
              detachEvents();
            }).catch(function () {
              // Wait for earliest natural passive movement without requiring click
            });
          }
        }

        function onPassiveMovement() {
          if (!audioPlayed) {
            audio.currentTime = 0;
            var p = audio.play();
            if (p !== undefined) {
              p.then(function () {
                audioPlayed = true;
                window.__afshaAudioPlayed = true;
                detachEvents();
              }).catch(function () {});
            }
          }
        }

        function detachEvents() {
          var events = ['mousemove', 'pointermove', 'scroll', 'wheel', 'touchstart', 'mouseenter', 'focus', 'click'];
          for (var i = 0; i < events.length; i++) {
            window.removeEventListener(events[i], onPassiveMovement, true);
            document.removeEventListener(events[i], onPassiveMovement, true);
          }
        }

        // 1. Immediate instant autoplay attempt
        attemptAutoPlay();

        // 2. DOMContentLoaded and Window load attempts
        document.addEventListener('DOMContentLoaded', attemptAutoPlay);
        window.addEventListener('load', attemptAutoPlay);

        // 3. Automated non-click passive triggers (mouse movement, scroll, hover, touch)
        var passiveEvts = ['mousemove', 'pointermove', 'scroll', 'wheel', 'touchstart', 'mouseenter', 'focus', 'click'];
        for (var j = 0; j < passiveEvts.length; j++) {
          window.addEventListener(passiveEvts[j], onPassiveMovement, { passive: true, capture: true });
          document.addEventListener(passiveEvts[j], onPassiveMovement, { passive: true, capture: true });
        }
      } catch (e) {}
    })();
  </script>
